<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Club Events</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell narrow"><header><span class="eyebrow">INFORMATICS CLUB</span><h1>Sign in</h1><p>Access the upcoming club events.</p></header>
<section class="panel"><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required value="student@example.test"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Your setup password"><button type="submit">Sign in</button><p id="message" class="message" role="status"></p></form></section>
<footer>Club Events · Web Development course exercise 2</footer></main><script src="/app.js" defer></script></body></html>
