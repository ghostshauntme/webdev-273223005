<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upcoming events | Club Events</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><nav class="topbar"><div><span class="eyebrow">INFORMATICS CLUB</span><h1>Upcoming events</h1></div><button id="logout" class="secondary" type="button">Sign out</button></nav>
<p class="subtitle">Find student activities and available places.</p><p id="message" class="message" role="status">Loading events...</p><section id="organizer-panel" hidden>
  <h2>Create event</h2>
  <form id="create-event">
    <label>Event title
      <input id="event-title" required maxlength="200">
    </label>
    <label>Date and time
      <input id="event-date" type="datetime-local" required>
    </label>
    <label>Capacity
      <input id="event-capacity" type="number" min="1" required>
    </label>
    <button type="submit">Create event</button>
  </form>
  <p id="create-message" role="status"></p>
</section>
<section id="events" class="grid" aria-label="Upcoming club events"></section><form method="post" action="/auth/google/start?link=1">
  <h2>Link Google account</h2>
  <label for="link-password">Confirm your current password</label>
  <input id="link-password" name="password"
    type="password" autocomplete="current-password" required>
  <button type="submit">Link Google account</button>
</form><footer>Events are loaded live from SQLite.</footer></main><script src="/app.js" defer></script></body></html>
